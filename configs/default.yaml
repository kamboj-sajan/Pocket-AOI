# Every threshold lives here, and each report records this file's hash.
# "guess" marks a starting value the spec leaves open; tune it in the block named.

models:
  # unsloth/sam3.1 is Meta's SAM 3.1 in transformers format. facebook/sam3.1 ships only a raw .pt.
  sam: unsloth/sam3.1

llm:
  temperature: 1.0
  top_p: 0.95
  top_k: 64
  max_tokens: 4096
  timeout_s: 180
  cache_dir: runs/llm_cache
  reasoning:
    smoke: low
    verdict: low
    silkscreen: low
    netlist: medium
    consequence: medium
  prompt_versions:
    smoke: v1
    verdict: v2
    silkscreen: v1
    netlist: v1
    consequence: v1

align:
  canonical_long_side: 2000
  lowe_ratio: 0.75
  ransac_px: 3.0
  min_inliers: 30               # 43-49 inliers at about 1 px were right on dev photos; a covered board got 13
  max_median_reproj_px: 2.0
  min_board_iou: 0.97            # used when SIFT is not accepted, so the outline is the only evidence
  min_board_iou_with_sift: 0.85  # guess, Block 1
  sift_passes: 2
  min_inliers_to_iterate: 12     # guess, Block 1
  board_threshold: 0.5           # the right mask scored 0.68-0.95 on five real photos, the rest under 0.35
  board_input_long_side: 1536    # SAM resizes its input anyway, so a 25 MP photo gains nothing
  polygon_epsilon_ratio: 0.01    # guess, Block 1
  max_quad_area_error: 0.25      # guess, Block 1
  edge_tolerance_ratio: 0.004    # guess, Block 1: a share of the board's diagonal
  edge_ransac_iterations: 400
  retake:
    border_touch_ratio: 0.05     # guess, Block 1
    max_side_ratio: 1.25         # guess, Block 1
    glare_value: 245             # guess, Block 1
    max_glare_fraction: 0.05     # guess, Block 1

segment:
  # "printed circuit board" scored only 0.07 on a white board; this scored 0.68-0.95 on all five test photos.
  board_prompt: electronic circuit board
  # Prompt text sent to SAM -> PartClass. Add "IC socket", "potentiometer" or "connector" per kit.
  class_prompts:
    # Chosen by scoring 35 prompts against hand-labelled parts on two real kits. "ceramic capacitor"
    # scored 0 on both, and "transistor" and "diode" fire on almost every part.
    cylindrical capacitor: electrolytic_capacitor
    small round capacitor: ceramic_capacitor
    striped resistor: resistor
    diode: diode
    colored LED: led
    microchip: ic
    transistor: transistor
  # Finds where every part is, whatever its kind: all 46 labelled parts on those two kits.
  locate_prompt: electronic component
  locate_threshold: 0.5        # lowest labelled part scored 0.52
  locate_floor: 0.3            # the lowest score kept in the cache, so the threshold can be retuned
  label_match_iou: 0.25        # how closely a detection must sit on a hand-labelled box to count
  score_threshold: 0.4
  mask_threshold: 0.5
  class_score_thresholds: {}   # per-class overrides, calibrated on golden photos in Block 1
  tile_grid: 2
  tile_overlap: 0.2
  merge_iou: 0.5
  specific_class_score_delta: 0.1
  min_part_area_ratio: 0.0002  # guess, Block 1
  max_part_area_ratio: 0.25    # guess, Block 1
  min_inside_board: 0.9        # guess, Block 1
  # Most specific first: on a close call between two prompts, the earlier class wins. "transistor"
  # and "diode" fire on almost any part, so they rank last or they would beat "resistor" on resistors.
  class_specificity: [led, ic, electrolytic_capacitor, resistor, ceramic_capacitor, transistor, diode, other]
  spike_floor: 0.25            # the lowest score the calibration run keeps
  spike_sweep: [0.3, 0.4, 0.5, 0.6, 0.7]
  suggested_threshold_margin: 0.02

compare:
  # Every value below is tuned on dev photos only. See eval/ and the README results.
  min_match_iou: 0.1
  centroid_cost_weight: 0.5
  crop_margin: 0.25
  shift_search_ratio: 0.08      # how far a part may lean, as a share of its crop's shorter side
  compare_side_px: 32           # each crop's shorter side is shrunk to this before comparing, to ignore fine texture
  low_ssim_value: 0.2           # an SSIM-map pixel below this clearly differs
  diff_value: 60                # a colour change above this, in 0-255, clearly differs
  # SAM not finding a part is already evidence, so this rule can be looser than the ones for matched parts.
  missing_ssim: 0.75
  missing_diff_fraction: 0.25
  same_appearance_ssim: 0.5     # above both of these, a mask that moved is SAM's noise, not a moved part
  same_appearance_diff_fraction: 0.3
  wrong_part_ssim: 0.35
  wrong_part_low_fraction: 0.25
  wrong_part_diff_fraction: 0.5
  shifted_offset_ratio: 0.3
  shifted_min_iou: 0.5
  rotation_crop_margin: 0.05
  rotation_margin: 0.08
  extra_max_golden_overlap: 0.3
  extra_ssim: 0.45
  extra_diff_fraction: 0.6

verdict:
  ok_drop_confidence: 0.7
  fault_type_confidence: 0.6
  composite_min_part_px: 384
  composite_max_side_px: 1024
  max_workers: 3                # calls at once, matching the Kaggle server's 3 slots; a hosted backend can take more

report:
  overlay_long_side: 2400

eval:
  min_defect_overlap: 0.3   # a finding counts if it overlaps a defect mask by this share of the smaller area
  min_in_frame_share: 0.25  # below this share inside the board outline, a defect is out of the camera frame we compare

polarized_classes: [electrolytic_capacitor, diode, led, ic, transistor]

polarity_hints:
  electrolytic_capacitor: light stripe with minus signs on the can sleeve marks the negative lead
  diode: painted band at one end marks the cathode
  led: flat edge on the rim marks the cathode
  ic: notch or dot at the pin-1 end
  transistor: flat printed face
